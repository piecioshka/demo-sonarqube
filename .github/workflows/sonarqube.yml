name: SonarQube

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sonar Scan
        # SonarQube host (self-hosted via ngrok) is ephemeral; keep CI green when it is unreachable
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

     - name: SonarQube Report Quality Gate
        if: steps.sonar-scan.outcome == 'success'
        uses: gocn/sonar-report-action@v1
        with:
          sonar-host: ${{ vars.SONAR_HOST_URL }}
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }} # GitHub 自动生成的 Token，无需手动配置
